name: Pruebas

# En cada push a master y en cada pull request: valida la enciclopedia, compila todos los scripts y corre la prueba
# automática completa de la app, sin pantalla.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validar la enciclopedia
        run: python3 tools/enciclopedia/validar.py

      - name: Instalar Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSLo godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Importar el proyecto
        run: godot --headless --path . --import || true

      - name: Compilar todos los scripts
        run: python3 tools/godot/tmap.py revisar

      - name: Prueba automática
        run: python3 tools/godot/tmap.py prueba

      - name: Registro de la prueba
        if: always()
        run: python3 tools/godot/tmap.py registros --errores -n 200 || true
