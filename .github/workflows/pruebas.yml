name: Pruebas

# En cada push a main y en cada pull request: valida la enciclopedia, controla que la interfaz y la página del proyecto
# tengan todos sus textos en inglés, compila todos los scripts y corre la prueba automática completa de la app, sin
# pantalla, en español y en inglés.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Validar la enciclopedia
        run: python3 tools/enciclopedia/validar.py

      - name: Textos de la interfaz y de la página en los dos idiomas
        run: python3 tools/traduccion/interfaz.py revisar

      - name: Cuánto de la enciclopedia está traducido
        run: python3 tools/traduccion/enciclopedia.py estado

      - name: Instalar Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSLo godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Importar el proyecto
        run: godot --headless --path . --import || true

      - name: Compilar todos los scripts
        run: python3 tools/godot/tmap.py revisar

      - name: Prueba automática
        run: python3 tools/godot/tmap.py prueba

      - name: Prueba automática en inglés
        run: python3 tools/godot/tmap.py prueba --idioma en

      - name: Prueba de las traducciones de la enciclopedia
        run: python3 tools/traduccion/probar.py

      - name: Prueba de las actualizaciones automáticas
        run: python3 tools/actualizacion/probar.py

      - name: Registro de la prueba
        if: always()
        run: python3 tools/godot/tmap.py registros --errores -n 200 || true
