name: Versión

# Al publicar una versión en GitHub (o a mano, con su etiqueta): exporta los ejecutables de Linux, Windows y macOS con
# las plantillas oficiales de Godot, comprueba que el de Linux arranque con todos sus datos (--verificar) y los sube a
# esa versión; los de macOS (uno para Intel y otro para Apple Silicon) se comprueban después en una Mac de cada tipo
# (trabajo verificar-macos), instalados con tools/instalar-macos.sh, que es como se instalan. Los presets están en export_presets.cfg; los datos de data/ entran con el filtro de exportación data/*.
# Después publica la actualización automática: los ejecutables y los datos nuevos en .gz y el manifiesto
# actualizacion.json en la versión fija «actualizaciones», que es lo que consultan las apps (docs/es/actualizaciones.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la versión (ya creada) a la que se suben los ejecutables, por ejemplo v0.2.0"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  exportar:
    # Solo las versiones de la app (vX.Y.Z): las de datos y la de «actualizaciones» las crea datos.yml.
    if: startsWith(github.event.release.tag_name || inputs.etiqueta, 'v')
    # El mismo grupo que datos.yml: los dos suben actualizacion.json, y si corren a la vez el último pisa al otro con
    # un manifiesto armado antes (pasó con la 0.3.2, que quedó anunciando la 0.3.1).
    concurrency:
      group: actualizaciones
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta }}
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Godot ${{ env.GODOT_VERSION }} y sus plantillas de exportación
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSLo plantillas.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          destino="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$destino"
          unzip -q plantillas.tpz -d plantillas
          mv plantillas/templates/* "$destino/"

      # La plantilla oficial de macOS trae un solo ejecutable universal (Intel y Apple Silicon). Para exportar uno por
      # procesador, Godot busca godot_macos_release.arm64 y .x86_64 al lado: se sacan del universal con llvm-lipo, y
      # Godot firma (ad hoc) el que copia al exportar.
      - name: Separar la plantilla de macOS en Intel y Apple Silicon
        run: |
          lipo="$(command -v llvm-lipo || ls /usr/bin/llvm-lipo-* /usr/lib/llvm-*/bin/llvm-lipo 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$lipo" ]; then sudo apt-get install -y -qq llvm >/dev/null; lipo="$(command -v llvm-lipo)"; fi
          destino="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir plantilla-macos && cd plantilla-macos
          unzip -q "$destino/macos.zip"
          dir=macos_template.app/Contents/MacOS
          for arq in arm64 x86_64; do
            "$lipo" "$dir/godot_macos_release.universal" -thin "$arq" -output "$dir/godot_macos_release.$arq"
            chmod +x "$dir/godot_macos_release.$arq"
            zip -q "$destino/macos.zip" "$dir/godot_macos_release.$arq"
          done
          "$lipo" -info "$dir/godot_macos_release.arm64" "$dir/godot_macos_release.x86_64"

      - name: Importar el proyecto
        run: godot --headless --path . --import || true

      - name: Sellar los datos (data/version.json, para que la app sepa qué datos trae)
        run: python3 tools/actualizacion/publicar.py sellar

      - name: Exportar Linux, Windows y macOS
        run: |
          mkdir -p build/linux build/windows build/macos-arm64 build/macos-x86_64
          godot --headless --path . --export-release "Linux" build/linux/TellMAP.x86_64
          godot --headless --path . --export-release "Windows" build/windows/TellMAP.exe
          # macOS: un TellMAP.app para cada procesador, dentro de un zip, con firma ad hoc (sin notarizar). Separados,
          # cada uno pesa la mitad que el universal, y el instalador elige el que corresponde.
          godot --headless --path . --export-release "macOS Apple Silicon" build/macos-arm64/TellMAP.zip
          godot --headless --path . --export-release "macOS Intel" build/macos-x86_64/TellMAP.zip
          ls -la build/linux build/windows build/macos-*

      - name: Comprobar que el ejecutable de Linux trae todos sus datos
        run: timeout 300 build/linux/TellMAP.x86_64 --headless -- --verificar

      - name: Empaquetar
        run: |
          for so in linux windows; do
            cp LICENSE README.md README.en.md "build/$so/"
            (cd "build/$so" && zip -qr "../TellMAP-${ETIQUETA}-${so}-x86_64.zip" .)
          done
          for arq in arm64 x86_64; do
            mkdir -p "build/macos-$arq-zip"
            (cd "build/macos-$arq-zip" && unzip -q "../macos-$arq/TellMAP.zip" && cp ../../LICENSE ../../README.md ../../README.en.md . &&
              zip -qry "../TellMAP-${ETIQUETA}-macos-$arq.zip" .)
          done
          ls -la build/*.zip

      - name: Subir a la versión ${{ env.ETIQUETA }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$ETIQUETA" build/*.zip --clobber

      # Las notas que se escriben al publicar quedan como están; abajo se suman las descargas, en español y en inglés.
      # Una sola vez por versión (la marca evita repetirlas si el trabajo se vuelve a correr).
      - name: Sumar las descargas a las notas de la versión, en español y en inglés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$ETIQUETA" --json body -q .body > notas.md
          if grep -q "<!-- descargas -->" notas.md; then exit 0; fi
          cat >> notas.md <<EOF

          <!-- descargas -->

          ---
          **Descargas.** Un solo archivo por sistema, con la app en español y en inglés: elige sola el idioma del equipo y se cambia en Ajustes.
          Linux: \`TellMAP-$ETIQUETA-linux-x86_64.zip\` · Windows: \`TellMAP-$ETIQUETA-windows-x86_64.zip\`. En Linux y Windows, las versiones siguientes se instalan solas.

          **macOS:** pegá esto en la Terminal (Aplicaciones → Utilidades → Terminal). Elige sola la versión para Intel o para Apple Silicon, la pone en Aplicaciones y la abre a la primera, sin pasar por Privacidad y seguridad. Para actualizar, se vuelve a correr.
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/bafif/tmap/main/tools/instalar-macos.sh | bash
          \`\`\`
          Los archivos de macOS, por si se bajan a mano: Apple Silicon (M1, M2…): \`TellMAP-$ETIQUETA-macos-arm64.dmg\` · Intel: \`TellMAP-$ETIQUETA-macos-x86_64.dmg\` (los .zip son los mismos). Así bajados, como la app no está notarizada por Apple, la primera vez hay que abrirla desde Configuración del Sistema → Privacidad y seguridad → «Abrir igualmente».

          **Downloads.** One file per system, with the app in both Spanish and English: it picks your computer's language and you can switch it in Settings.
          Linux: \`TellMAP-$ETIQUETA-linux-x86_64.zip\` · Windows: \`TellMAP-$ETIQUETA-windows-x86_64.zip\`. On Linux and Windows, later versions install themselves.

          **macOS:** paste this into Terminal (Applications → Utilities → Terminal). It picks the Intel or Apple Silicon build by itself, puts it in Applications and opens it right away, with no trip to Privacy & Security. To update, run it again.
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/bafif/tmap/main/tools/instalar-macos.sh | bash
          \`\`\`
          The macOS files, for downloading by hand: Apple Silicon (M1, M2…): \`TellMAP-$ETIQUETA-macos-arm64.dmg\` · Intel: \`TellMAP-$ETIQUETA-macos-x86_64.dmg\` (the .zip files are the same). Downloaded that way, since the app isn't notarized by Apple, the first time it has to be opened from System Settings → Privacy & Security → "Open Anyway".
          EOF
          gh release edit "$ETIQUETA" --notes-file notas.md

      # Una versión preliminar (para probar los ejecutables) no se anuncia a las apps instaladas. Se pregunta a GitHub y
      # no al evento, para que valga también al correrlo a mano.
      - name: Publicar la actualización automática
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$ETIQUETA" --json isPrerelease -q .isPrerelease)" = "true" ]; then
            echo "Versión preliminar: no se publica la actualización automática."; exit 0
          fi
          gh release download actualizaciones -p actualizacion.json -D previo || true
          python3 tools/actualizacion/publicar.py manifiesto --etiqueta "$ETIQUETA" --salida subir \
            --previo previo/actualizacion.json --repo "$GITHUB_REPOSITORY" \
            --app linux-x86_64=build/linux/TellMAP.x86_64 --app windows-x86_64=build/windows/TellMAP.exe
          gh release upload "$ETIQUETA" subir/*.gz --clobber
          gh release view actualizaciones >/dev/null 2>&1 || gh release create actualizaciones --prerelease \
            --title "Actualizaciones automáticas · Automatic updates" \
            --notes "Manifiesto que consultan las apps para actualizarse solas. No es una versión para bajar. · The manifest the apps check to update themselves. Not a release to download."
          gh release upload actualizaciones subir/actualizacion.json --clobber

  verificar-macos:
    # Los ejecutables de macOS se exportan desde Linux: acá se instalan en una Mac de cada tipo con el mismo instalador
    # que usa la gente (tools/instalar-macos.sh, que los baja de la versión con curl) y se comprueba que la firma ad hoc
    # valga, que arranquen con todos sus datos y que dibujen. Si algo falla, el zip de esa Mac se saca de la versión
    # para que nadie baje uno roto. macOS no se actualiza solo (el manifiesto no lo incluye): se vuelve a correr el
    # instalador.
    needs: exportar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arq: arm64
            runner: macos-latest
          - arq: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta }}
      ARQ: ${{ matrix.arq }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools/instalar-macos.sh
          sparse-checkout-cone-mode: false

      - name: Instalar con tools/instalar-macos.sh, como lo instala la gente
        run: |
          uname -m; sysctl -n machdep.cpu.brand_string; sw_vers
          TELLMAP_VERSION="$ETIQUETA" TELLMAP_DESTINO="$PWD/app" TELLMAP_NO_ABRIR=1 bash tools/instalar-macos.sh
          lipo -archs app/TellMAP.app/Contents/MacOS/TellMAP | grep -qx "$ARQ"

      - name: Comprobar la firma
        run: codesign --verify --deep --strict --verbose=2 app/TellMAP.app

      - name: Comprobar que arranca con todos sus datos
        timeout-minutes: 5
        run: app/TellMAP.app/Contents/MacOS/TellMAP --headless -- --verificar

      # Con --headless no se dibuja nada: acá se abre la ventana de verdad con el motor que elige la app y se mira que
      # la captura no salga casi lisa. Pasaba con Forward+ en una MacBook Pro 2017 con Intel Iris Plus 640: arrancaba
      # sin errores y la ventana quedaba oscura. Los runners son máquinas virtuales sin placa de video de verdad, así
      # que no reemplazan probar en una Mac: el de Intel dibuja con «Apple Software Renderer» y no llega a sacar la
      # captura. Si el runner no la saca en cuatro minutos, se cierra la app y solo avisa.
      - name: Comprobar que dibuja (una captura que no salga lisa)
        timeout-minutes: 6
        run: |
          app/TellMAP.app/Contents/MacOS/TellMAP -- --captura="$PWD/captura-macos-$ARQ.png" --comprobar_dibujo --diagnostico &
          pid=$!
          for i in $(seq 240); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; sleep 2; kill -9 "$pid" 2>/dev/null || true
            echo "::warning::TellMAP no sacó la captura en cuatro minutos en el runner ($ARQ, sin placa de video): no se comprobó que dibuje."
            exit 0
          fi
          estado=0; wait "$pid" || estado=$?
          if [ ! -f "captura-macos-$ARQ.png" ]; then
            echo "::warning::TellMAP no llegó a sacar la captura en el runner ($ARQ): no se comprobó que dibuje."
            exit 0
          fi
          exit "$estado"

      - name: Guardar la captura
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: captura-macos-${{ matrix.arq }}
          path: captura-macos-*.png
          if-no-files-found: ignore

      # El formato de siempre en Mac: un disco con TellMAP.app y un acceso a Aplicaciones para arrastrarla, para quien
      # baja a mano. Se arma acá porque hdiutil solo existe en macOS, con la app ya comprobada; si este paso falla, la
      # versión queda igual con el zip.
      - name: Armar el .dmg y sumarlo a la versión
        continue-on-error: true
        run: |
          gh release download "$ETIQUETA" -R "$GITHUB_REPOSITORY" -p "TellMAP-${ETIQUETA}-macos-$ARQ.zip"
          mkdir disco
          ditto -x -k "TellMAP-${ETIQUETA}-macos-$ARQ.zip" disco
          ln -s /Applications disco/Applications
          hdiutil create -volname TellMAP -srcfolder disco -ov -format UDZO "TellMAP-${ETIQUETA}-macos-$ARQ.dmg"
          hdiutil verify "TellMAP-${ETIQUETA}-macos-$ARQ.dmg"
          gh release upload "$ETIQUETA" "TellMAP-${ETIQUETA}-macos-$ARQ.dmg" -R "$GITHUB_REPOSITORY" --clobber

      - name: Si algo falló, sacar el zip de la versión
        if: failure()
        run: gh release delete-asset "$ETIQUETA" "TellMAP-${ETIQUETA}-macos-$ARQ.zip" -R "$GITHUB_REPOSITORY" -y
